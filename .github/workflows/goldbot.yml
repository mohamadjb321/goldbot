name: Gold Bot

on:
  workflow_dispatch:
  schedule:
    # Iran uses UTC+03:30 year-round. These target 09:10, 14:10,
    # 19:10 and 23:09 Tehran, 50 minutes before the requested slots.
    - cron: "40 5 * * *"
    - cron: "40 10 * * *"
    - cron: "40 15 * * *"
    - cron: "39 19 * * *"


jobs:
  send-gold-price:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          BRSAPI_API_KEY: ${{ secrets.BRSAPI_API_KEY }}
          TETHER_URL: ${{ vars.TETHER_URL }}
        run: python main.py
