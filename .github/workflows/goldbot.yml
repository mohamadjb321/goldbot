name: Gold Bot

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only; do not send Telegram or write state"
        type: boolean
        default: true
      slot:
        description: "Publication slot"
        type: choice
        options: [noon, afternoon, night]
        default: noon
      allow_late_recovery:
        description: "Permit one intentional live recovery after the selected slot window"
        type: boolean
        default: false
  schedule:
    # Tehran is UTC+03:30 year-round: 12:00, 16:00 and 21:00.
    - cron: "30 8 * * *"
    - cron: "30 12 * * *"
    - cron: "30 17 * * *"

permissions:
  contents: write

concurrency:
  group: gold-publication-state
  cancel-in-progress: false

jobs:
  send-gold-price:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          BRSAPI_API_KEY: ${{ secrets.BRSAPI_API_KEY }}
          TETHER_URL: ${{ vars.TETHER_URL }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          ALLOW_LATE_RECOVERY: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_late_recovery || 'false' }}
          GOLD_SLOT: ${{ github.event_name == 'workflow_dispatch' && inputs.slot || '' }}
        run: python main.py

      - name: Persist publication state
        if: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
        shell: bash
        run: |
          if [ -z "$(git status --porcelain state/)" ]; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add state/
          git commit -m "state: gold publication [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "::warning::gold publication succeeded but state could not be persisted; do not rerun manually"
          exit 0
